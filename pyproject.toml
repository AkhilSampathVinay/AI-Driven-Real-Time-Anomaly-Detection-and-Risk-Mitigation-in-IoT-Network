[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-guard"
version = "2.0.0"
description = "AI-driven real-time anomaly detection and risk mitigation for IoT networks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ch. Akhil Sampath Vinay" }]
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5",
    "scikit-learn>=1.2",
    "numpy>=1.23",
    "matplotlib>=3.6",
]
keywords = ["iot", "security", "intrusion-detection", "anomaly-detection", "mirai", "scapy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
iot-guard = "iot_guard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
